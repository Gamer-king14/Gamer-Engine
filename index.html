<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GAMER ENGINE 0.2</title>
<style>
:root{--bg:#070b14;--panel:#101827;--line:#25354d;--cyan:#4ed8ff;--purple:#a56bff;--text:#eaf4ff;--muted:#91a5c1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.top{height:54px;background:#0b1220;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 12px}.brand{font-weight:900;letter-spacing:1px;font-size:15px}.brand span{color:var(--cyan)}.pill{font-size:11px;color:#b9d8ff;border:1px solid #284663;border-radius:20px;padding:4px 8px}.top .spacer{flex:1}.btn{background:#152238;border:1px solid #2a4262;color:var(--text);border-radius:9px;padding:9px 12px;font-weight:650;cursor:pointer}.btn:active{transform:scale(.97)}.btn.primary{background:linear-gradient(120deg,#137ab1,#6046b6);border-color:#52c9ff}.layout{flex:1;min-height:0;display:grid;grid-template-columns:190px 1fr 210px}.side{background:var(--panel);overflow:auto;border-right:1px solid var(--line)}.right{border-right:0;border-left:1px solid var(--line)}.section{padding:12px;border-bottom:1px solid var(--line)}.secttitle{font-size:11px;letter-spacing:1.3px;color:var(--muted);font-weight:800;margin-bottom:10px}.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tool{padding:10px 6px;background:#131f32;border:1px solid #273c56;border-radius:8px;color:#e3efff;font-size:12px}.tool.active{outline:1px solid var(--cyan);color:var(--cyan)}.objects{display:flex;flex-direction:column;gap:4px}.obj{border:1px solid transparent;border-radius:7px;padding:8px;font-size:13px;color:#d4e5fa;display:flex;gap:8px;align-items:center;cursor:pointer}.obj.selected{background:#162c43;border-color:#24638b}.viewport{position:relative;min-width:0;background:#0b1220;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.hint{position:absolute;top:10px;left:10px;pointer-events:none;background:#07101bd9;border:1px solid #253b54;border-radius:8px;padding:7px 10px;color:#a8c8e8;font-size:11px}.viewtools{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:7px;background:#08111dd9;padding:7px;border:1px solid #2a3c55;border-radius:12px}.inspector label{display:block;color:var(--muted);font-size:11px;margin:9px 0 4px}.inspector input{width:100%;background:#0b1321;color:white;border:1px solid #2a3b54;border-radius:7px;padding:8px}.inspector .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}.foot{height:27px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:10px;color:var(--muted);background:#09111d}.mobilebar{display:none}
@media(max-width:720px){.layout{grid-template-columns:120px 1fr}.right{display:none}.top{height:48px;padding:0 8px;gap:6px}.brand{font-size:12px}.btn{padding:8px 9px;font-size:12px}.side .section{padding:8px}.tool{padding:9px 3px;font-size:10px}.hint{font-size:10px;max-width:85%}.mobilebar{display:flex;position:absolute;right:9px;top:9px;gap:6px}.mobilebar .btn{padding:7px 9px}.viewtools{bottom:10px}.foot{height:24px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><span>⚡ GAMER</span> ENGINE</div><div class="pill">ALPHA 0.2</div><div class="spacer"></div><button class="btn" id="save">Save</button><button class="btn primary" id="play">▶ Play</button></header>
<div class="layout"><aside class="side"><div class="section"><div class="secttitle">CREATE OBJECT</div><div class="toolgrid"><button class="tool" data-add="cube">▣ Cube</button><button class="tool" data-add="sphere">● Sphere</button><button class="tool" data-add="cylinder">⬭ Cylinder</button><button class="tool" data-add="plane">▱ Plane</button></div></div><div class="section"><div class="secttitle">TOOLS</div><div class="toolgrid"><button class="tool active" data-tool="select">↖ Select</button><button class="tool" data-tool="move">✥ Move</button><button class="tool" data-tool="rotate">⟳ Rotate</button><button class="tool" data-tool="scale">⤢ Scale</button></div></div><div class="section"><div class="secttitle">MOVE AXIS</div><div class="toolgrid"><button class="tool axis active" data-axis="free">Free</button><button class="tool axis" data-axis="x">X</button><button class="tool axis" data-axis="y">Y</button><button class="tool axis" data-axis="z">Z</button></div></div><div class="section"><div class="secttitle">WORLD</div><button class="tool" id="resetView" style="width:100%">Reset Camera</button></div></aside>
<main class="viewport" id="viewport"><div class="hint">Drag to orbit · Pinch / scroll to zoom · Tap an object to select</div><div class="mobilebar"><button class="btn" id="addQuick">＋</button></div><div class="viewtools"><button class="btn" id="gridToggle">Grid: On</button><button class="btn" id="clear">Clear</button></div></main>
<aside class="side right"><div class="section"><div class="secttitle">WORLD EXPLORER</div><div class="objects" id="objects"></div></div><div class="section inspector"><div class="secttitle">PROPERTIES</div><div id="emptyProps" style="color:var(--muted);font-size:12px">Select an object to edit.</div><div id="props" hidden><label>Name</label><input id="name"><label>Position (X / Y / Z)</label><div class="row"><input id="px" type="number" step=".1"><input id="py" type="number" step=".1"><input id="pz" type="number" step=".1"></div><label>Scale (X / Y / Z)</label><div class="row"><input id="sx" type="number" step=".1"><input id="sy" type="number" step=".1"><input id="sz" type="number" step=".1"></div><label>Color</label><input id="color" type="color" value="#4ed8ff"></div></div></aside></div><footer class="foot"><span id="status">Ready · No object selected</span><span>GAMER ENGINE</span></footer></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const viewport=document.getElementById('viewport'),objectsEl=document.getElementById('objects'),status=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1220);scene.fog=new THREE.Fog(0x0b1220,25,80);
const camera=new THREE.PerspectiveCamera(60,1,.1,1000);camera.position.set(9,8,11);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;viewport.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb9ddff,0x243047,2));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(7,12,8);sun.castShadow=true;scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x101b2c,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.03;floor.receiveShadow=true;scene.add(floor);
let grid=new THREE.GridHelper(40,40,0x3a6a8a,0x23364d);grid.position.y=.01;scene.add(grid);
let orbit={target:new THREE.Vector3(0,1,0),radius:15,theta:Math.PI/4,phi:Math.PI/3};let objects=[],selected=null,tool='select',playing=false,drag=null,ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
function orbitUpdate(){orbit.phi=Math.max(.15,Math.min(Math.PI-.15,orbit.phi));camera.position.set(orbit.target.x+orbit.radius*Math.sin(orbit.phi)*Math.sin(orbit.theta),orbit.target.y+orbit.radius*Math.cos(orbit.phi),orbit.target.z+orbit.radius*Math.sin(orbit.phi)*Math.cos(orbit.theta));camera.lookAt(orbit.target)}orbitUpdate();
function resize(){const r=viewport.getBoundingClientRect();camera.aspect=r.width/r.height;camera.updateProjectionMatrix();renderer.setSize(r.width,r.height,false)}new ResizeObserver(resize).observe(viewport);resize();
function add(type='cube'){let geo,mat=new THREE.MeshStandardMaterial({color:Math.floor(Math.random()*0xffffff),roughness:.65});if(type==='sphere')geo=new THREE.SphereGeometry(.7,32,20);else if(type==='cylinder')geo=new THREE.CylinderGeometry(.55,.55,1.3,32);else if(type==='plane')geo=new THREE.BoxGeometry(2,.08,2);else geo=new THREE.BoxGeometry(1,1,1);const mesh=new THREE.Mesh(geo,mat);mesh.position.set(0,.6,0);mesh.castShadow=true;mesh.receiveShadow=true;mesh.userData={type,name:type[0].toUpperCase()+type.slice(1)+' '+(objects.length+1)};scene.add(mesh);objects.push(mesh);select(mesh);renderList();status.textContent='Created '+mesh.userData.name;}
function renderList(){objectsEl.innerHTML='';objects.forEach((o,i)=>{const div=document.createElement('div');div.className='obj'+(o===selected?' selected':'');div.innerHTML=`<span>◈</span>${o.userData.name}`;div.onclick=()=>select(o);objectsEl.appendChild(div)})}
function select(o){selected=o;renderList();const props=document.getElementById('props'),empty=document.getElementById('emptyProps');if(!o){props.hidden=true;empty.style.display='';status.textContent='No object selected';return}props.hidden=false;empty.style.display='none';document.getElementById('name').value=o.userData.name;['px','py','pz'].forEach((id,i)=>document.getElementById(id).value=o.position[['x','y','z'][i]].toFixed(2));['sx','sy','sz'].forEach((id,i)=>document.getElementById(id).value=o.scale[['x','y','z'][i]].toFixed(2));document.getElementById('color').value='#'+o.material.color.getHexString();status.textContent='Selected '+o.userData.name}
function bindInput(id,fn){document.getElementById(id).addEventListener('input',()=>{if(!selected)return;fn(selected,document.getElementById(id).value);})}bindInput('name',(o,v)=>{o.userData.name=v;renderList()});['px','py','pz'].forEach((id,i)=>bindInput(id,(o,v)=>o.position[['x','y','z'][i]]=Number(v)));['sx','sy','sz'].forEach((id,i)=>bindInput(id,(o,v)=>o.scale[['x','y','z'][i]]=Number(v)));bindInput('color',(o,v)=>o.material.color.set(v));
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));status.textContent='Tool: '+tool});document.getElementById('resetView').onclick=()=>{orbit={target:new THREE.Vector3(0,1,0),radius:15,theta:Math.PI/4,phi:Math.PI/3};orbitUpdate()};document.getElementById('gridToggle').onclick=e=>{grid.visible=!grid.visible;e.target.textContent='Grid: '+(grid.visible?'On':'Off')};document.getElementById('clear').onclick=()=>{objects.forEach(o=>scene.remove(o));objects=[];select(null);renderList()};document.getElementById('addQuick').onclick=()=>add('cube');
let down=false,last={x:0,y:0},startPos={x:0,y:0},moved=false,moveAxis='free';
document.querySelectorAll('[data-axis]').forEach(b=>b.onclick=()=>{moveAxis=b.dataset.axis;document.querySelectorAll('[data-axis]').forEach(x=>x.classList.toggle('active',x===b));status.textContent='Move axis: '+moveAxis.toUpperCase()});
renderer.domElement.addEventListener('pointerdown',e=>{down=true;moved=false;startPos=last={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(e.clientX-startPos.x)+Math.abs(e.clientY-startPos.y)>6)moved=true;last={x:e.clientX,y:e.clientY};if(tool==='move'&&selected){const v=.01;if(moveAxis==='x')selected.position.x+=dx*v;else if(moveAxis==='y')selected.position.y-=dy*v;else if(moveAxis==='z')selected.position.z+=dy*v;else{selected.position.x+=dx*v;selected.position.z+=dy*v}syncProps()}else if(tool==='rotate'&&selected){selected.rotation.y+=dx*.01;selected.rotation.x+=dy*.01}else if(tool==='scale'&&selected){let q=Math.max(.1,selected.scale.x+dx*.01);selected.scale.setScalar(q);syncProps()}else{orbit.theta-=dx*.006;orbit.phi-=dy*.006;orbitUpdate()}});
function syncProps(){if(!selected)return;['px','py','pz'].forEach((id,i)=>document.getElementById(id).value=selected.position[['x','y','z'][i]].toFixed(2));['sx','sy','sz'].forEach((id,i)=>document.getElementById(id).value=selected.scale[['x','y','z'][i]].toFixed(2));}
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;down=false;if(!moved){pointer.x=e.clientX/renderer.domElement.clientWidth*2-1;pointer.y=-(e.clientY/renderer.domElement.clientHeight)*2+1;ray.setFromCamera(pointer,camera);let hits=ray.intersectObjects(objects);if(hits.length)select(hits[0].object)}});renderer.domElement.addEventListener('wheel',e=>{orbit.radius=Math.max(3,Math.min(60,orbit.radius+e.deltaY*.015));orbitUpdate()},{passive:true});
let touchStart=null;renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length===2)touchStart={dist:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2&&touchStart){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);orbit.radius=Math.max(3,Math.min(60,orbit.radius+(touchStart.dist-d)*.02));touchStart.dist=d;orbitUpdate()}},{passive:true});
document.getElementById('save').onclick=()=>{const data=objects.map(o=>({type:o.userData.type,name:o.userData.name,position:o.position.toArray(),scale:o.scale.toArray(),rotation:o.rotation.toArray(),color:o.material.color.getHex()}));localStorage.setItem('gamerEngineScene',JSON.stringify(data));status.textContent='Scene saved locally'};
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'■ Stop':'▶ Play';status.textContent=playing?'Play mode (prototype)':'Editor mode';viewport.style.border=playing?'2px solid #40d7ff':'none'};
const saved=localStorage.getItem('gamerEngineScene');if(saved){try{JSON.parse(saved).forEach(d=>{add(d.type);let o=objects.at(-1);o.userData.name=d.name;o.position.fromArray(d.position);o.scale.fromArray(d.scale);o.rotation.fromArray(d.rotation);o.material.color.setHex(d.color)});select(null)}catch{}};
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();
</script></body></html>
